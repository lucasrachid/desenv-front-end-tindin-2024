<div class="flex flex-col items-center justify-center size-container">
    <div>
        @if(editing) {
            <h2>Editar uma aula</h2>
            <h2>{{ videoClassModal!.title }}</h2>
        } @else {
            <h2>Nova aula</h2>
            <h2>Criar uma nova aula</h2>
        }
    </div>
    <form [formGroup]="form" class="mt-8">

        <div class="pt-4 pb-4">
            <span class="p-float-label">
                <input pInputText id="className" formControlName="className" />
                <label for="className">Nome da aula</label>
            </span>
        </div>

        <div class="pt-4 pb-4">
            <span class="p-float-label">
                <input pInputText id="classDescription" formControlName="classDescription" />
                <label for="classDescription">Descrição da aula</label>
            </span>
        </div>

        <div class="pt-4 pb-4">
            <span class="p-float-label">
                <input pInputText id="coverClass" formControlName="coverClass" />
                <label for="coverClass">Imagem de apresentação</label>
            </span>
        </div>

        <div class="pt-4 pb-4">
            <span class="p-float-label" title="Link vídeo Youtube">
                <input pInputText id="urlVideoClass" formControlName="urlVideoClass" />
                <label for="urlVideoClass">Vídeo de apresentação</label>
            </span>
        </div>

        <div class="flex justify-between mt-8">
            <p-button label="Cancelar" (click)="close()"></p-button>
            <p-button label="Salvar" (click)="submit()" [loading]="loading">
            </p-button>
        </div>

    </form>
</div>
